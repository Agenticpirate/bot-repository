<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Agenthunt — Personal AI agents</title>
  <meta name="description" content="Keep up with the latest personal AI agents launching daily. Updated twice a day. Curated by KP." />
  <link rel="canonical" href="https://agent-hunt.netlify.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agent-hunt.netlify.app/" />
  <meta property="og:title" content="Agenthunt — Personal AI agents" />
  <meta property="og:description" content="Keep up with the latest personal AI agents launching daily" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Agenthunt — Personal AI agents" />
  <meta name="twitter:description" content="Keep up with the latest personal AI agents launching daily" />
  <meta name="theme-color" content="#0c0f14" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="Agenthunt home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-name">Agenthunt</span>
      </a>
      <nav class="header-links" aria-label="Site">
        <a href="https://x.com/thisiskp_" target="_blank" rel="noopener noreferrer">KP</a>
      </nav>
    </div>
  </header>

  <main>
        <section class="hero wrap">
      <p class="kicker">A field guide · <span id="hero-count">58</span> agents</p>
      <h1 class="visually-hidden">Agenthunt</h1>

      <div class="shuffle-stage" aria-label="Interactive wordmark">
        <div class="shuffle-toolbar">
          <button type="button" id="shuffle-btn" class="shuffle-btn" aria-label="Shuffle word">
            <svg class="shuffle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M16 3h5v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 20c5-5 7-7 9-9l8-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 16v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 15l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 4l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>SHUFFLE</span>
          </button>
        </div>
        <div id="block-word" class="block-word" role="img" aria-label="muse"></div>
        <p id="shuffle-live" class="visually-hidden" aria-live="polite"></p>
      </div>

      <p class="subtitle">Keep up with the latest personal AI agents launching daily</p>
      <p class="refresh-note">Updated twice a day · <span id="last-refreshed">Sep 12, 2026 · 5:25 PM ET</span></p>
    </section>

    <section class="featured-section" aria-labelledby="featured-heading">
      <div class="wrap featured-head">
        <div>
          <h2 id="featured-heading" class="section-title">Featured</h2>
          <p class="section-lede">Ones to try first.</p>
        </div>
      </div>
      <div class="featured-scroll wrap">
        <div id="featured" class="featured-row"></div>
      </div>
    </section>

    <section class="controls wrap" aria-label="Filters">
      <p class="section-title directory-kicker">Directory</p>
      <div id="chips" class="chips" role="toolbar" aria-label="Category filters"></div>
      <div class="feed-meta">
        <p id="count" class="count" aria-live="polite"></p>
      </div>
    </section>

    <section class="feed wrap" aria-label="Agents">
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty hidden">No agents in this category.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="site-visits" class="site-visits" hidden></p>
      <p>curated by <a href="https://x.com/thisiskp_" target="_blank" rel="noopener noreferrer">KP</a> · not affiliated with any of the products listed</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
