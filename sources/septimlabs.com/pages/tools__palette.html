<script>
// ---------- Color utilities ----------
function hexToHsl(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.slice(0,2), 16) / 255;
  const g = parseInt(hex.slice(2,4), 16) / 255;
  const b = parseInt(hex.slice(4,6), 16) / 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)); break;
      case g: h = ((b - r) / d + 2); break;
      case b: h = ((r - g) / d + 4); break;
    }
    h *= 60;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}
function hslToHex(h, s, l) {
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r=0,g=0,b=0;
  if (h < 60) { r=c; g=x; }
  else if (h < 120) { r=x; g=c; }
  else if (h < 180) { g=c; b=x; }
  else if (h < 240) { g=x; b=c; }
  else if (h < 300) { r=x; b=c; }
  else { r=c; b=x; }
  const to = v => Math.round((v + m) * 255).toString(16).padStart(2,'0');
  return '#' + to(r) + to(g) + to(b);
}
function contrastText(hex) {
  const [, , l] = hexToHsl(hex);
  return l > 55 ? 'var(--bg-1)' : '#f8f8f8';
}
// Rough color-name labels (display only, not dictionary-accurate).
function colorName(hex) {
  const [h, s, l] = hexToHsl(hex);
  if (s < 10) return l < 15 ? 'ink' : l < 30 ? 'charcoal' : l < 55 ? 'slate' : l < 75 ? 'stone' : 'chalk';
  let base;
  if (h < 15 || h >= 345) base = 'rust';
  else if (h < 45) base = 'amber';
  else if (h < 70) base = 'citron';
  else if (h < 150) base = 'fern';
  else if (h < 190) base = 'teal';
  else if (h < 230) base = 'azure';
  else if (h < 265) base = 'indigo';
  else if (h < 295) base = 'violet';
  else if (h < 330) base = 'rose';
  else base = 'magenta';
  const tone = l < 25 ? 'deep' : l < 45 ? 'rich' : l < 65 ? '' : l < 80 ? 'pale' : 'bleach';
  return (tone ? tone + ' ' : '') + base;
}

// ---------- Harmony generators ----------
function randHex(minL=18, maxL=75, minS=35, maxS=85) {
  const h = Math.floor(Math.random() * 360);
  const s = minS + Math.floor(Math.random() * (maxS - minS));
  const l = minL + Math.floor(Math.random() * (maxL - minL));
  return hslToHex(h, s, l);
}
function genPalette(mode, seedHex) {
  const seedH = seedHex ? hexToHsl(seedHex) : [Math.floor(Math.random()*360), 60 + Math.floor(Math.random()*25), 50];
  const [h, s, l] = seedH;
  switch (mode) {
    case 'analogous':
      return [h - 30, h - 15, h, h + 15, h + 30].map(hh => hslToHex(hh, s, l + (Math.random()*20 - 10)));
    case 'complementary':
      return [h, h + 20, (h + 180) % 360, (h + 200) % 360, (h + 160) % 360].map((hh, i) => hslToHex(hh, s, l + (i*6 - 12)));
    case 'triadic':
      return [h, (h + 120) % 360, (h + 240) % 360, (h + 60) % 360, (h + 180) % 360].map((hh, i) => hslToHex(hh, s - (i*4), l + (i*4 - 8)));
    case 'tetradic':
      return [h, (h + 90) % 360, (h + 180) % 360, (h + 270) % 360, (h + 45) % 360].map((hh, i) => hslToHex(hh, s - (i*3), l + (i*3 - 6)));
    case 'monochrome':
      return [l - 35, l - 18, l, l + 18, l + 35].map(ll => hslToHex(h, s, Math.max(8, Math.min(92, ll))));
    case 'shades':
      return [15, 32, 50, 68, 85].map(ll => hslToHex(h, s * 0.85, ll));
    case 'dark-ui':
      return [hslToHex(h, 8, 6), hslToHex(h, 12, 12), hslToHex(h, 10, 22), hslToHex(h, s, 55), hslToHex(h, s+10, 72)];
    default:
      return [0,0,0,0,0].map(() => randHex());
  }
}

// ---------- State ----------
const state = {
  colors: [null, null, null, null, null],
  locked: [false, false, false, false, false],
  harmony: 'random',
};

function applyHash() {
  if (!location.hash) return;
  const hex = location.hash.replace('#', '').split('-');
  if (hex.length === 5 && hex.every(h => /^[0-9a-f]{6}$/i.test(h))) {
    state.colors = hex.map(h => '#' + h);
    state.locked = [false, false, false, false, false];
  }
}
function writeHash() {
  const hex = state.colors.map(c => c.replace('#', '')).join('-');
  history.replaceState(null, '', '#' + hex);
}

function regenerate() {
  const next = genPalette(state.harmony, state.locked.some(x => x) ? state.colors[state.locked.indexOf(true)] : null);
  state.colors = state.colors.map((c, i) => state.locked[i] ? c : next[i]);
  render();
  writeHash();
}

function render() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  state.colors.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (state.locked[i] ? ' locked' : '');
    sw.style.background = c;
    sw.style.color = contrastText(c);
    sw.innerHTML = `
      <div class="hex">${c.toUpperCase()}</div>
      <div class="name">${colorName(c)}</div>
      <div class="controls">
        <div class="ctl copy" title="Copy hex">&#128203;</div>
        <div class="ctl lock ${state.locked[i] ? 'locked' : ''}" title="Lock (L)">${state.locked[i] ? '&#128274;' : '&#128275;'}</div>
        <div class="ctl tune" title="Nudge">&#8645;</div>
      </div>
    `;
    sw.querySelector('.copy').onclick = (e) => { e.stopPropagation(); copyText(c); };
    sw.querySelector('.lock').onclick = (e) => { e.stopPropagation(); state.locked[i] = !state.locked[i]; render(); };
    sw.querySelector('.tune').onclick = (e) => {
      e.stopPropagation();
      if (state.locked[i]) { toast('Unlock first to nudge'); return; }
      const [h, s, l] = hexToHsl(state.colors[i]);
      state.colors[i] = hslToHex(h, s, Math.max(5, Math.min(95, l + (Math.random() > 0.5 ? 8 : -8))));
      render(); writeHash();
    };
    sw.onclick = () => copyText(c);
    stage.appendChild(sw);
  });
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied ' + text));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1400);
}

// ---------- Exports ----------
const exporters = {
  css(c) {
    return ':root {\n' + c.map((hex, i) => `  --color-${i+1}: ${hex};`).join('\n') + '\n}';
  },
  tw(c) {
    return 'module.exports = {\n  theme: {\n    extend: {\n      colors: {\n' +
      c.map((hex, i) => `        palette${i+1}: "${hex}",`).join('\n') +
      '\n      }\n    }\n  }\n};';
  },
  json(c) {
    return JSON.stringify({
      palette: c.map((hex, i) => ({ name: `color-${i+1}`, label: colorName(hex), value: hex })),
      generated: new Date().toISOString(),
      source: 'septimlabs.com/tools/palette'
    }, null, 2);
  },
  scss(c) {
    return c.map((hex, i) => `$color-${i+1}: ${hex};`).join('\n') + '\n\n$palette: (\n' +
      c.map((hex, i) => `  "color-${i+1}": ${hex}`).join(',\n') + '\n);';
  },
  svg(c) {
    const w = 600, h = 120, step = w / c.length;
    const rects = c.map((hex, i) => `  <rect x="${i*step}" y="0" width="${step}" height="${h}" fill="${hex}"/>\n  <text x="${i*step + step/2}" y="${h/2 + 4}" text-anchor="middle" font-family="monospace" font-size="14" fill="${contrastText(hex)}">${hex.toUpperCase()}</text>`).join('\n');
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">\n${rects}\n</svg>`;
  },
  claude(c) {
    return `# Palette\n\nGenerated by Septim Palette (${new Date().toISOString().slice(0,10)}).\n\n` +
      `Use these hex values consistently across the UI. Do not invent new accents mid-build.\n\n` +
      c.map((hex, i) => `- **color-${i+1}** \u2014 \`${hex}\` \u2014 ${colorName(hex)}`).join('\n') +
      `\n\nTailwind config + CSS variables also available at septimlabs.com/tools/palette`;
  },
};

let currentTab = 'css';
function renderExport() {
  const out = document.getElementById('export-out');
  out.textContent = exporters[currentTab](state.colors);
}

// ---------- Event wiring ----------
document.querySelectorAll('.harmony button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.harmony button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.harmony = btn.dataset.h;
    regenerate();
  };
});
document.getElementById('regen').onclick = regenerate;
document.getElementById('save-url').onclick = () => copyText(location.href);
document.getElementById('export').onclick = () => {
  document.getElementById('panel').classList.add('open');
  renderExport();
};
document.getElementById('close-panel').onclick = () => document.getElementById('panel').classList.remove('open');
document.getElementById('panel').onclick = (e) => {
  if (e.target.id === 'panel') document.getElementById('panel').classList.remove('open');
};
document.querySelectorAll('#tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.t;
    renderExport();
  };
});
document.getElementById('copy-export').onclick = () => copyText(document.getElementById('export-out').textContent);

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); regenerate(); }
  if (e.key === 'Escape') { document.getElementById('panel').classList.remove('open'); }
  if (e.key === 'l' || e.key === 'L') {
    // lock whatever swatch the mouse is hovering (fallback: cycle)
    const hover = document.querySelector('.swatch:hover');
    if (hover) {
      const idx = [...hover.parentElement.children].indexOf(hover);
      state.locked[idx] = !state.locked[idx]; render();
    }
  }
});

applyHash();
if (!state.colors[0]) {
  state.colors = genPalette('random');
}
render();
writeHash();
</script>
