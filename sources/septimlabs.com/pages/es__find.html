<style>
  body[data-page="find"]{ --p: var(--n-aqua); }
  .pHero{position:relative;padding:120px 24px 40px;border-bottom:1px solid var(--line);text-align:center;overflow:hidden}

  .pHero .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--shade) 1px,transparent 1px),linear-gradient(90deg,var(--shade) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,var(--bg),transparent);opacity:.5}
  .pHero-inner{position:relative;max-width:720px;margin:0 auto}
  .pHero h1{font-size:clamp(40px,5.6vw,68px);font-weight:600;letter-spacing:-.04em;line-height:.98;margin:18px 0 16px}
  .pHero h1 em{font-style:normal;color:var(--p)}
  .pHero .lead{font-size:16px;line-height:1.6;color:var(--ink-2);max-width:54ch;margin:0 auto}

  .quizWrap{max-width:720px;margin:0 auto;padding:48px 24px 80px}
  .pBar{display:flex;align-items:center;gap:14px;margin-bottom:28px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
  .pBar .track{flex:1;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
  .pBar .fill{height:100%;background:var(--p);width:0;transition:width .4s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--p)}
  .pBar b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  .qCard{border:1px solid var(--line);border-radius:6px;background:var(--bg-1);padding:32px 30px}
  .qCard .qnum{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--p);text-transform:uppercase;margin-bottom:12px}
  .qCard h2{font-size:24px;font-weight:600;letter-spacing:-.018em;line-height:1.18;margin-bottom:6px}

  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--line-2);border-radius:6px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:.15s;font-size:14px}
  .choice:hover{border-color:var(--p);background:color-mix(in srgb,var(--p) 6%,transparent);transform:translateX(2px)}
  .choice .key{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;width:22px}
  .choice .b .l{font-weight:500;letter-spacing:-.005em;display:block;margin-bottom:2px}
  .choice .b .h{font-size:12px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em}
  .choice .arr{color:var(--p);opacity:0;transform:translateX(-4px);transition:.15s;font-family:var(--mono)}
  .choice:hover .arr{opacity:1;transform:translateX(0)}
  .qFoot{display:flex;justify-content:space-between;margin-top:22px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
  .back{background:none;border:none;color:var(--ink-3);font:inherit;cursor:pointer;padding:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .back:hover{color:var(--p)}
  .back:disabled{opacity:.3;cursor:not-allowed}

  .resCard{border:1px solid var(--p);border-radius:6px;background:var(--bg-1);padding:36px 32px;position:relative;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--p) 30%,transparent),0 24px 60px -20px color-mix(in srgb,var(--p) 30%,transparent)}
  .resCard::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--p);box-shadow:0 0 12px var(--p)}
  .resCard .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--p);text-transform:uppercase;margin-bottom:14px}
  .resCard h2{font-size:36px;font-weight:600;letter-spacing:-.025em;margin-bottom:8px}
  .resCard .pitch{font-size:15px;color:var(--ink-2);margin-bottom:22px;line-height:1.6}
  .resCard .why{padding:18px 20px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:24px}
  .resCard .why .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .resCard .why p{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0}
  .resCard .why p strong{color:var(--ink)}
  .resCta{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:var(--p);color:var(--bg);border:none;border-radius:99px;font-family:var(--sans);font-size:14px;font-weight:600;text-decoration:none;letter-spacing:-.005em;cursor:pointer;transition:.15s}
  .resCta:hover{transform:translateY(-1px);box-shadow:0 8px 24px -4px var(--p-glow)}
  .resMeta{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-top:14px}
  .altCard{margin-top:14px;padding:22px 24px;border:1px solid var(--line);border-radius:6px;background:var(--bg-1)}
  .altCard .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .altCard h3{font-size:18px;font-weight:600;letter-spacing:-.012em;margin-bottom:6px}
  .altCard p{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:8px}
  .altCard a{font-family:var(--mono);font-size:11px;color:var(--p);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
  .altCard a:hover{text-decoration:underline}
  .resActions{display:flex;justify-content:space-between;margin-top:22px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .resActions a,.resActions button{color:var(--ink-3);text-decoration:none;background:none;border:none;font:inherit;cursor:pointer;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .resActions a:hover,.resActions button:hover{color:var(--p)}

  @keyframes flyIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fly{animation:flyIn .35s cubic-bezier(.4,0,.2,1) both}
</style>

<body data-page="find">

<section class="pHero">

  <div class="pHero-inner">
    <div class="eyebrow" style="justify-content:center;display:inline-flex"><span class="dot"></span><span>FIND · 5Q · NO EMAIL</span></div>
    <h1>Find your <em>Septim.</em></h1>
    <p class="lead">Five questions. One product. Thirty seconds. Skip the catalogue and get pointed at the one thing built for your situation.</p>
  </div>
</section>

<section class="quizWrap">
  <div class="pBar"><span>QUESTION <b id="qcount">1</b> / <b>5</b></span><div class="track"><div class="fill" id="pfill"></div></div><span id="plabel">20%</span></div>

<script src="../../site.js?v=4.6.0"></script>
<script>
(() => {
  const QS = [
    {k:"role",q:"Who's asking?",h:"// closest fit",cs:[
      {k:"solo",l:"Solo developer",h:"shipping side projects or contracts"},
      {k:"founder",l:"Solo SaaS founder",h:"running a paid product"},
      {k:"agency",l:"Small team / agency lead",h:"2-10 engineers"},
      {k:"freelance",l:"Freelancer / consultant",h:"client work, contracts, invoices"},
      {k:"mgr",l:"Non-technical manager",h:"buying tools for the team"},
      {k:"normie",l:"Just exploring",h:"not hands-on in the codebase"},
    ]},
    {k:"pain",q:"What's the sharpest pain right now?",h:"// pick the one that hurts most",cs:[
      {k:"adhoc",l:"Every Claude session feels reinvented",h:"no consistent playbook"},
      {k:"pr",l:"PR review is my daily time sink",h:"everything queues on me"},
      {k:"cost",l:"API cost anxiety",h:"bills are unpredictable"},
      {k:"security",l:"Security posture matters",h:"compliance / production risk"},
      {k:"legal",l:"Contracts are scary",h:"freelance agreements, MSAs"},
      {k:"stripe",l:"Stripe dashboard isn't enough",h:"can't see what I need"},
      {k:"browsing",l:"Just browsing",h:"figuring out what hurts"},
    ]},
    {k:"budget",q:"What's your budget for the next thing?",h:"// today",cs:[
      {k:"cheap",l:"Under $30",h:"weekend impulse"},
      {k:"mid",l:"$30 – $99",h:"considered purchase"},
      {k:"team",l:"Team-sized",h:"$100–$500 if it's right"},
      {k:"flex",l:"Whatever it costs",h:"if it's worth it"},
    ]},
    {k:"when",q:"When do you need it?",h:"// time horizon",cs:[
      {k:"now",l:"Right now",h:"shipping it today"},
      {k:"week",l:"This week",h:"weekend project"},
      {k:"month",l:"Within a month",h:"fine to wait"},
    ]},
    {k:"style",q:"How do you like to buy?",h:"// final filter",cs:[
      {k:"focused",l:"One focused product",h:"solves one problem"},
      {k:"bundle",l:"A bundle",h:"prefer to save by combining"},
      {k:"team",l:"Team-deployable",h:"my whole team should use it"},
      {k:"compliance",l:"Compliance-safe",h:"security team needs to review"},
    ]},
  ];

  const P = {
    drills:    {n:"Septim Drills",      px:"$29", c:"#caff00", url:"../drills/", pitch:"25 ready-made Claude instructions. Same playbook every time."},
    agents:    {n:"Septim Agents Pack", px:"$49", c:"#caff00", url:"../agents/index.html", pitch:"10 specialist personas — your whole exec team in ~/.claude/agents/."},
    flint:     {n:"Septim Flint",       px:"$19", c:"var(--p)", url:"../flint/", pitch:"5 GitHub Actions that run Claude code review on every PR. Self-hosted."},
    tether:    {n:"Septim Tether",      px:"$19", c:"var(--p)", url:"../tether/", pitch:"3 pre-commit hooks that catch bugs before they're saved."},
    stack:     {n:"Review Stack",       px:"$59", c:"var(--p)", url:"../review-stack/", pitch:"Drills + Flint + Tether. Three layers of code review."},
    vault:     {n:"Septim Vault",       px:"$29", c:"var(--p)", url:"../vault/", pitch:"Browser-only encrypted credential vault. Your keys, your machine."},
    spire:     {n:"Septim Spire",       px:"$199", c:"var(--p)", url:"../tools/spire.html", pitch:"MCP security hardening kit. 24-point self-audit."},
    ledger:    {n:"Septim Ledger",      px:"$49", c:"#9f7aea", url:"../tools/ledger/", pitch:"Stripe dashboard built for SaaS founders. MRR, churn, recovery."},
    witness:   {n:"Septim Witness",     px:"$29", c:"#e8d9b5", url:"../tools/witness/", pitch:"Contract-language flagger. Spots clauses that hurt freelancers."},
    costguard: {n:"Septim Cost Guard",  px:"$29", c:"#ffd76b", url:"../tools/cost-guard/", pitch:"Real-time Claude API cost alerts before the bill explodes."},
    tonight:   {n:"Septim Tonight",     px:"$29", c:"#ff6b6b", url:"../tools/tonight/", pitch:"Ship-tonight kit. Auth, billing, deploy in one weekend."},
    teams:     {n:"Septim Teams",       px:"$499", c:"var(--p)", url:"../tools/teams/", pitch:"Team-deployable agents pack with admin + audit log."},
    audit:     {n:"Septim Audit",       px:"$99", c:"var(--p)", url:"../audit/index.html", pitch:"Ten lenses on your product. PDF + Loom in 48 hours."},
    guard:     {n:"Septim Guard",       px:"$199", c:"#ff6b6b", url:"../tools/guard/", pitch:"Cost + security guardrails for autonomous agents."},
    claude:    {n:"Claude Code Mastery Bundle", px:"$69", c:"var(--p)", url:"../claude-bundle/", pitch:"Drills + Agents + Prompts. The full Claude upgrade."},
  };

  function recommend(a){
    const r=(p,b)=>({primary:P[p],alt:P[b]});
    if(a.pain==="security") return r("spire","vault");
    if(a.pain==="legal"||(a.role==="freelance"&&a.pain==="browsing")) return r("witness","audit");
    if(a.pain==="cost") return r("costguard","guard");
    if(a.pain==="stripe"||(a.role==="founder"&&a.pain==="browsing")) return r("ledger","witness");
    if(a.role==="normie") return r("audit","teams");
    if(a.style==="team"||a.role==="agency"||a.role==="mgr"){
      if(a.role==="mgr") return r("audit","teams");
      if(a.pain==="pr") return r("stack","teams");
      return r("teams","stack");
    }
    if(a.style==="compliance") return r("spire","stack");
    if(a.style==="bundle"){ if(a.pain==="adhoc") return r("claude","stack"); return r("stack","tonight"); }
    if(a.pain==="pr"){
      if(a.budget==="cheap") return r("tether","flint");
      if(a.budget==="mid") return r("stack","flint");
      return r("stack","teams");
    }
    if(a.pain==="adhoc"){
      if(a.budget==="cheap") return r("drills","tonight");
      return r("drills","agents");
    }
    if(a.pain==="browsing"){
      if(a.budget==="cheap") return r("drills","vault");
      return r("agents","audit");
    }
    if(a.role==="solo") return r("drills","tonight");
    if(a.role==="founder") return r("ledger","drills");
    return r("agents","drills");
  }

  const ans={}, KS=QS.map(q=>q.k);
  let i=0;
  const quiz=document.getElementById("quiz"), res=document.getElementById("result");
  const fill=document.getElementById("pfill"), plabel=document.getElementById("plabel"), qc=document.getElementById("qcount");

  function renderQ(){
    const q=QS[i]; if(!q){ renderR(); return; }
    fill.style.width=(i/QS.length*100)+"%";
    plabel.textContent=Math.round(i/QS.length*100)+"%";
    qc.textContent=i+1;
    res.innerHTML="";
    const card=document.createElement("div");
    card.className="qCard fly";
    card.innerHTML=`<div class="qnum">// QUESTION ${String(i+1).padStart(2,"0")}</div>
      <h2>${q.q}</h2><div class="sub">${q.h}</div>
      <div class="choices" id="ch"></div>
      <div class="qFoot"><button class="back" id="b" ${i===0?"disabled":""}>← BACK</button><span>// SELECT ONE</span></div>`;
    quiz.innerHTML=""; quiz.appendChild(card);
    const ch=card.querySelector("#ch");
    q.cs.forEach((c,j)=>{
      const b=document.createElement("button");
      b.className="choice";
      b.innerHTML=`<span class="key">${String.fromCharCode(65+j)}</span><span class="b"><span class="l">${c.l}</span><span class="h">// ${c.h}</span></span><span class="arr">→</span>`;
      b.onclick=()=>{ ans[KS[i]]=c.k; i++; renderQ(); };
      ch.appendChild(b);
    });
    card.querySelector("#b").onclick=()=>{ if(i>0){ i--; renderQ(); } };
  }

  function renderR(){
    fill.style.width="100%"; plabel.textContent="DONE"; qc.textContent="5";
    const rec=recommend(ans), p=rec.primary, alt=rec.alt;
    const why=buildWhy(ans,p);
    quiz.innerHTML="";
    res.innerHTML=`<div class="resCard fly">
      <div class="badge">// YOUR RECOMMENDATION</div>
      <h2>${p.n}</h2>
      <p class="pitch">${p.pitch}</p>
      <div class="why"><div class="lbl">// WHY THIS FITS YOU</div><p>${why}</p></div>
      <a class="resCta" href="${p.url}">View ${p.n} <span>→</span></a>
      <div class="resMeta">${p.px} · LIFETIME · 30-DAY REFUND</div>
    </div>
    <div class="altCard fly">
      <div class="lbl">// IF THAT ISN'T A FIT</div>
      <h3>${alt.n} · ${alt.px}</h3>
      <p>${alt.pitch}</p>
      <a href="${alt.url}">SEE ${alt.n.toUpperCase()} →</a>
    </div>
    <div class="resActions">
      <button id="rs">← START OVER</button>
      <a href="../compare/index.html">SEE ALL PRODUCTS →</a>
    </div>`;
    document.getElementById("rs").onclick=()=>{ i=0; for(const k in ans) delete ans[k]; renderQ(); };
  }

  function buildWhy(a,p){
    const b=[];
    if(a.role==="solo") b.push("You're shipping solo");
    if(a.role==="agency") b.push("You're running a small team");
    if(a.role==="freelance") b.push("You're a freelancer");
    if(a.role==="founder") b.push("You're a solo SaaS founder");
    if(a.role==="mgr") b.push("You're buying for a team you don't code with");
    if(a.role==="normie") b.push("You're not hands-on in code");
    if(a.pain==="adhoc") b.push("every Claude session feels reinvented");
    if(a.pain==="pr") b.push("PR review eats your day");
    if(a.pain==="cost") b.push("API cost anxiety is real");
    if(a.pain==="security") b.push("security posture matters");
    if(a.pain==="legal") b.push("contracts are scary");
    if(a.pain==="stripe") b.push("Stripe's own dashboard isn't enough");
    if(a.pain==="browsing") b.push("you're still figuring out what hurts");
    if(a.budget==="cheap") b.push("budget is under $30 today");
    if(a.budget==="mid") b.push("you'll pay $30-$99 for the right thing");
    if(a.budget==="team") b.push("team-sized budget available");
    if(a.when==="now") b.push("and you want it today");
    if(a.style==="bundle") b.push("and you prefer bundles");
    if(a.style==="team") b.push("and your whole team should use it");
    if(a.style==="compliance") b.push("and your security team will review it");
    const o=b.slice(0,-1).join(", ")+(b.length>1?", and ":"")+(b[b.length-1]||"");
    return o.charAt(0).toUpperCase()+o.slice(1)+` — which is exactly why <strong>${p.n}</strong> is the most direct fit.`;
  }

  renderQ();
})();
</script>
