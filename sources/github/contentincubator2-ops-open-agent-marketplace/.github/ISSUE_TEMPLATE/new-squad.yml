name: Submit a new marketing squad
description: Propose an outcome-based squad recipe
title: "Squad: "
labels: [squad, contribution]
body:
  - type: input
    id: usecase
    attributes:
      label: Business outcome
    validations:
      required: true
  - type: textarea
    id: agents
    attributes:
      label: Agents and workflow
      description: List agent slugs, workflow steps, and expected outputs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety
      options:
        - label: This contains only fictional or public-safe information.
          required: true
