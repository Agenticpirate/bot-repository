name: Submit a new marketing agent
description: Propose a public-safe agent profile
title: "Agent: "
labels: [agent, contribution]
body:
  - type: input
    id: slug
    attributes:
      label: Agent slug
      description: kebab-case public slug
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Agent profile
      description: Include title, category, summary, example tasks, channels, funnel stage, and deliverables.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety
      options:
        - label: This contains only fictional or public-safe information.
          required: true
