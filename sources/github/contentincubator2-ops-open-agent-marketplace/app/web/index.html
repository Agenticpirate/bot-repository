<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Agent Marketplace</title>
  <link rel="stylesheet" href="/app/web/styles.css" />
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">~/open-agent-marketplace</p>
      <h1>Build an AI marketing team marketplace.</h1>
      <p>Reusable agent profiles, squad recipes, workflow templates, and evaluation rubrics for Marketing Agent OS builders.</p>
      <div class="quickFilters">
        <button data-filter="SaaS">SaaS</button>
        <button data-filter="Ecommerce">Ecommerce</button>
        <button data-filter="conversion">Conversion</button>
        <button data-filter="Email">Email</button>
        <button data-filter="LinkedIn">LinkedIn</button>
        <button data-filter="SEO">SEO</button>
      </div>
    </section>
    <section>
      <div class="sectionHeader"><h2>$ find agents</h2><span id="agentCount"></span></div>
      <input id="q" placeholder="Search by channel, funnel stage, deliverable, or skill..." />
      <div id="agentGrid" class="grid"></div>
    </section>
    <section>
      <div class="sectionHeader"><h2>squads.json</h2><span id="squadCount"></span></div>
      <div id="squadGrid" class="grid"></div>
    </section>
  </main>
  <script src="/app/web/app.js"></script>
</body>
</html>
