<!doctype html>
<html>
  <meta name="viewport" content="width=device-width,initial-scale=1" /><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #e6e9dd;
      color: #294536;
      font-family: Georgia, serif;
    }
    main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vw;
    }
    small {
      font: 14px Arial;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #587461;
    }
    h1 {
      font-size: clamp(30px, 7vw, 95px);
      font-weight: 400;
      line-height: 1.05;
      max-width: 750px;
      margin: 4vw 0;
    }
    p {
      font: clamp(14px, 2vw, 26px) / 1.6 Arial;
      max-width: 650px;
    }
    .page {
      position: absolute;
      bottom: 5%;
      right: 6%;
      font: 14px Arial;
    }
  </style>
  <main>
    <small>Weekend field notes · sample deck</small>
    <h1 id="title"></h1>
    <p id="body"></p>
    <span class="page" id="page"></span>
  </main>
  <script>
    const slides = [
      [
        'Make room for a quieter weekend.',
        'Choose a few things that matter. Leave the rest for another day.',
      ],
      [
        'Begin outside.',
        'Take a walk before the errands. Notice what has changed since last time.',
      ],
      ['Leave the afternoon open.', 'A little space is part of the plan.'],
    ]
    let active = Number(new URLSearchParams(location.search).get('active') || 0)
    function render() {
      document.getElementById('title').textContent = slides[active][0]
      document.getElementById('body').textContent = slides[active][1]
      document.getElementById('page').textContent = active + 1 + ' / 3'
    }
    addEventListener('message', (e) => {
      if (e.data?.type === 'deck:goto') {
        active = Math.max(0, Math.min(2, e.data.index))
        render()
      }
    })
    render()
  </script>
</html>
