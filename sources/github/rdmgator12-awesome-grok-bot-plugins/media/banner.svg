<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Awesome Grok Bot Plugins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0c"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8d5a3"/>
      <stop offset="100%" stop-color="#c4a574"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g transform="translate(80, 70)">
    <rect x="8" y="18" width="88" height="64" rx="8" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="52" cy="50" r="10" fill="url(#accent)"/>
    <rect x="28" y="90" width="48" height="8" rx="2" fill="url(#accent)"/>
    <line x1="104" y1="50" x2="150" y2="50" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="150" cy="50" r="6" fill="url(#accent)"/>
    <line x1="52" y1="18" x2="52" y2="-12" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="52" cy="-12" r="6" fill="url(#accent)"/>
  </g>
  <text x="280" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#f5f0e8">Awesome Grok Bot</text>
  <text x="280" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="300" fill="url(#accent)">Plugins</text>
  <text x="280" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#a89884" letter-spacing="2">THE GROK BOT IN-APP MARKETPLACE CATALOG</text>
